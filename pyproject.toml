[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chocolate-cbc"
version = "1.0.0"
description = "Analysis pipeline for the CHOCOLATE 2 coherent beam combining experiment (HERA/LULI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pierre Lebegue" }]
keywords = ["coherent beam combining", "wavefront", "Zernike", "laser", "PHASICS"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "cmcrameri>=1.4",
    "tifffile>=2021.7",
    "pillow>=9.0",
    "joblib>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
progress = ["tqdm>=4.60"]
dev = ["black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
